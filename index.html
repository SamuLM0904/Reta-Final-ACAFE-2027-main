<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataforma de estudos para o vestibular de Medicina da ACAFE 2027. Questões reais das provas anteriores de Biologia, Química, Física, Matemática, Português, Literatura, História, Geografia e Espanhol.">
  <meta name="theme-color" content="#0a1118">

  <title>Reta Final ACAFE 2027</title>

  <!-- Tema salvo (Configurações → Aparência), aplicado antes de desenhar a página — ver js/tema.js -->
  <script>
    (function () {
      var barras = { escuro: '#0a1118', claro: '#f4f6f8' };
      var tema = null;
      try { tema = localStorage.getItem('acafe2027:tema'); } catch (e) { /* ignora */ }
      if (!barras[tema]) tema = 'escuro';
      document.documentElement.dataset.tema = tema;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', barras[tema]);
    })();
  </script>

  <!-- Estilos — ordem importa: variáveis → base → telas -->
  <link rel="stylesheet" href="css/variaveis.css?v=129">
  <link rel="stylesheet" href="css/base.css?v=133">
  <link rel="stylesheet" href="css/dashboard.css?v=129">
  <link rel="stylesheet" href="css/questoes.css?v=134">
  <link rel="stylesheet" href="css/simulado.css?v=132">
  <link rel="stylesheet" href="css/guia.css?v=131">
  <link rel="stylesheet" href="css/login.css?v=129">

  <!--
    Os dados são scripts clássicos (sem type="module"), carregados antes do app:
      dados/questoes.js          → window.QUESTOES        (questões de estudo por matéria)
      dados/provas-anteriores.js → window.QUESTOES_PROVAS (provas antigas — só simulados)
      dados/provas/*.js          → uma prova por arquivo, acrescentadas a QUESTOES_PROVAS
      dados/estudo/*.js          → uma prova de outro vestibular por arquivo, acrescentadas a QUESTOES
  -->
  <script src="dados/questoes.js?v=124"></script>
  <script src="dados/provas-anteriores.js?v=125"></script>
  <script src="dados/conteudos.js?v=133"></script>
  <script src="dados/obras.js?v=131"></script>
  <!-- Uma linha por prova (cada arquivo acrescenta as suas questões ao banco) -->
  <script src="dados/provas/2026-inverno.js?v=130"></script>
  <script src="dados/provas/2026-verao.js?v=130"></script>
  <script src="dados/provas/2025-inverno.js?v=130"></script>
  <script src="dados/provas/2025-verao.js?v=130"></script>
  <script src="dados/provas/2024-inverno.js?v=130"></script>
  <script src="dados/provas/2024-verao.js?v=130"></script>
  <!-- Questões de estudo: uma linha por prova de outro vestibular (acrescentadas a QUESTOES) -->
  <script src="dados/estudo/enem-2025-d1.js?v=135"></script>
  <script src="dados/estudo/enem-2025-matematica.js?v=135"></script>
  <script src="dados/estudo/enem-2025-natureza.js?v=135"></script>
  <script src="dados/estudo/enem-2024-d1.js?v=135"></script>
  <script src="dados/estudo/enem-2024-matematica.js?v=135"></script>
  <script src="dados/estudo/enem-2024-natureza.js?v=135"></script>
  <script src="dados/estudo/fuvest-2026-a.js?v=135"></script>
  <script src="dados/estudo/fuvest-2026-b.js?v=135"></script>
  <script src="dados/estudo/fuvest-2025-a.js?v=135"></script>
  <script src="dados/estudo/fuvest-2025-b.js?v=135"></script>
  <script src="dados/estudo/unicamp-2026.js?v=135"></script>
  <script src="dados/estudo/unicamp-2027.js?v=135"></script>
  <script src="dados/estudo/unesp-2026-a.js?v=135"></script>
  <script src="dados/estudo/unesp-2026-b.js?v=135"></script>
  <script src="dados/estudo/unesp-2025-a.js?v=135"></script>
  <script src="dados/estudo/unesp-2025-b.js?v=135"></script>
  <script src="dados/estudo/ufpr-2025.js?v=135"></script>
  <script src="dados/estudo/ufpr-2026.js?v=135"></script>
  <script src="dados/estudo/udesc-2026-matutino.js?v=135"></script>
  <script src="dados/estudo/udesc-2026-vespertino.js?v=135"></script>
  <script src="dados/estudo/udesc-2025-matutino.js?v=135"></script>
  <script src="dados/estudo/udesc-2025-vespertino.js?v=135"></script>
  <script src="dados/estudo/pucpr-2026.js?v=135"></script>
  <script src="dados/estudo/pucpr-2027.js?v=135"></script>
</head>

<body>

  <!-- Cabeçalho: preenchido pelo JS -->
  <div id="cabecalho"></div>

  <!-- Conteúdo principal: trocado pelo roteador -->
  <main id="app" role="main">
    <!-- Tela de carregamento inicial enquanto o JS não inicializa -->
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100dvh - 64px);
      "
      aria-busy="true"
      aria-label="Carregando..."
    >
      <div class="spinner"></div>
    </div>
  </main>

  <!--
    app.js é o ponto de entrada dos módulos ES.
    type="module" garante que os imports funcionem e que o script
    rode após o DOM estar disponível (defer implícito).
  -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
